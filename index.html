<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リンブー語キーボード</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #833a41;
            color: white;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .keyboard-container {
            display: flex;
            flex-wrap: wrap; /* キーボードが折り返されるように */
            justify-content: center;
            gap: 5px; /* gapを小さく */
        }
        .output-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }
        .keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(30px, 1fr)); /* キーの最小サイズを小さく */
            gap: 2px; /* gapを小さく */
            max-width: 600px; /* キーボード全体の幅を調整 */
            margin-bottom: 5px; /* キーボード間の間隔を調整 */
        }
        .key {
            padding: 3px; /* paddingを小さく */
            background-color: white;
            color: #833a41;
            border: none;
            cursor: pointer;
            font-size: 1em; /* font-sizeを小さく */
            border-radius: 3px; /* border-radiusを小さく */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 30px; /* キーの最小幅を調整 */
            box-sizing: border-box; /* paddingを含めてサイズ計算 */
        }
        .key span { /* リンブー文字のサイズを調整 */
            font-size: 1.2em;
        }
        .key small { /* ローマ字のサイズを調整 */
            font-size: 0.8em;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background-color: white;
            color: #833a41;
            font-size: 1.5em; /* outputのfont-sizeを調整 */
            min-height: 50px;
            width: 80%;
            max-width: 600px;
            text-align: left;
            border: none;
            outline: none;
            box-sizing: border-box; /* paddingを含めてサイズ計算 */
        }
        .controls {
            margin-top: 10px;
        }
        .dark-mode {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>リンブー語キーボード</h1>
        <div class="output-container">
            <textarea id="output" contenteditable="true" oninput="syncInput()"></textarea>
        </div>
        <div class="controls">
            <button onclick="toggleDarkMode()">ダークモード</button>
            <button onclick="clearOutput()">クリア</button>
            <button onclick="deleteLast()">削除</button>
            <button onclick="addSpace()">空白</button>
            <input type="range" min="1" max="3" step="0.1" value="1.5" oninput="changeFontSize(this.value)">
        </div>
        <div class="keyboard-container">
            <div class="keyboard" id="consonants"></div>
            <div class="keyboard" id="vowels"></div>
            <div class="keyboard" id="glides"></div>
            <div class="keyboard" id="finals"></div>
        </div>
    </div>
    <script>
        const consonants = {"ᤁ": "k", "ᤂ": "kh", "ᤃ": "g", "ᤄ": "gh", "ᤅ": "ng", "ᤆ": "c", "ᤇ": "ch", "ᤈ": "j", "ᤉ": "jh", "ᤋ": "t", "ᤌ": "th", "ᤍ": "d", "ᤎ": "dh", "ᤏ": "n", "ᤐ": "p", "ᤑ": "ph", "ᤒ": "b", "ᤓ": "bh", "ᤕ": "y", "ᤖ": "r", "ᤗ": "l", "ᤘ": "w", "ᤙ": "sh", "ᤚ": "ss", "ᤛ": "s", "ᤜ": "h"};
        const vowels = {"ᤠ": "a", "ᤡ": "i", "ᤢ": "u", "ᤣ": "ee", "ᤤ": "ai", "ᤥ": "oo", "ᤦ": "au", "ᤧ": "e", "ᤨ": "o"};
        const glides = {"ᤩ": "y", "ᤪ": "r", "ᤫ": "w"};
        const finals = {"ᤰ": "k", "ᤱ": "ng", "ᤳ": "t", "ᤴ": "n", "ᤵ": "p", "ᤶ": "m", "ᤷ": "r", "ᤸ": "l"};

        function addToOutput(char) {
            document.getElementById("output").value += char;
        }

        function createKeyboard(containerId, characters) {
            const container = document.getElementById(containerId);
            Object.keys(characters).forEach(char => {
                let btn = document.createElement("button");
                btn.innerHTML = `<span>${char}</span><small>${characters[char]}</small>`;
                btn.classList.add("key");
                btn.onclick = () => addToOutput(char);
                container.appendChild(btn);
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function clearOutput() {
            document.getElementById("output").value = "";
        }

        function deleteLast() {
            let output = document.getElementById("output");
            output.value = output.value.slice(0, -1);
        }

        function addSpace() {
            document.getElementById("output").value += " ";
        }

        function changeFontSize(value) {
            document.getElementById("output").style.fontSize = value + "em";
        }

        createKeyboard("consonants", consonants);
        createKeyboard("vowels", vowels);
        createKeyboard("glides", glides);
        createKeyboard("finals", finals);
    </script>
</body>
</html>
